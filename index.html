<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UniValidade</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --azul: #1F36C7;
    --azul-claro: #4A63E7;
    --fundo: #F5F7FF;
    --card: #FFFFFF;
    --texto: #1A1A2E;
    --cinza: #8A8FA3;
    --vermelho: #E53935;
    --amarelo: #FFB300;
    --verde: #43A047;
    --sombra: 0 4px 16px rgba(31,54,199,0.08);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--fundo);
    color: var(--texto);
    padding-bottom: 90px;
    min-height: 100vh;
  }
  h1, h2, h3 { font-family: 'Poppins', sans-serif; }

  /* ---------- TELAS ---------- */
  .tela { display: none; padding: 20px; }
  .tela.ativa { display: block; animation: fade .3s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* ---------- LOGIN ---------- */
  .login-wrap {
    display: flex; flex-direction: column; justify-content: center;
    min-height: 100vh; padding: 24px;
  }
  .logo {
    text-align: center; margin-bottom: 32px;
  }
  .logo-circle {
    width: 80px; height: 80px; margin: 0 auto 16px;
    background: linear-gradient(135deg, var(--azul), var(--azul-claro));
    border-radius: 24px; display: flex; align-items: center; justify-content: center;
    font-size: 40px; box-shadow: var(--sombra);
  }
  .logo h1 { font-size: 26px; color: var(--azul); }
  .logo p { color: var(--cinza); font-size: 14px; margin-top: 4px; }

  .campo { margin-bottom: 16px; }
  .campo label {
    display: block; font-size: 13px; font-weight: 600;
    color: var(--texto); margin-bottom: 6px;
  }
  .campo input, .campo select {
    width: 100%; padding: 14px 16px; border: 2px solid #E4E8F5;
    border-radius: 14px; font-size: 15px; font-family: inherit;
    background: var(--card); transition: .2s;
  }
  .campo input:focus {
    outline: none; border-color: var(--azul-claro);
    box-shadow: 0 0 0 4px rgba(74,99,231,.1);
  }

  .btn {
    width: 100%; padding: 16px; border: none; border-radius: 14px;
    background: linear-gradient(135deg, var(--azul), var(--azul-claro));
    color: white; font-size: 16px; font-weight: 600; font-family: inherit;
    cursor: pointer; transition: .2s; box-shadow: 0 6px 16px rgba(31,54,199,.25);
  }
  .btn:active { transform: scale(.97); }
  .btn-secundario {
    background: var(--card); color: var(--azul); border: 2px solid #E4E8F5;
    box-shadow: none;
  }

  /* ---------- HEADER ---------- */
  .header { margin-bottom: 20px; }
  .header h2 { font-size: 22px; }
  .header .sub { color: var(--cinza); font-size: 13px; margin-top: 2px; }

  /* ---------- CARDS RESUMO ---------- */
  .resumo {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
    margin-bottom: 24px;
  }
  .card-resumo {
    background: var(--card); border-radius: 16px; padding: 14px 8px;
    text-align: center; box-shadow: var(--sombra);
  }
  .card-resumo .num { font-family: 'Poppins'; font-size: 22px; font-weight: 700; }
  .card-resumo .lbl { font-size: 11px; color: var(--cinza); margin-top: 2px; }
  .card-resumo.bw .num { color: #E91E63; }
  .card-resumo.hc .num { color: #2196F3; }
  .card-resumo.nt .num { color: #FF9800; }

  /* ---------- LISTA PRODUTOS ---------- */
  .produto {
    background: var(--card); border-radius: 18px; padding: 14px;
    margin-bottom: 12px; box-shadow: var(--sombra);
    display: flex; gap: 14px; align-items: center;
    border-left: 5px solid var(--verde); position: relative;
  }
  .produto.alerta { border-left-color: var(--amarelo); }
  .produto.vencido { border-left-color: var(--vermelho); }
  .produto .icone-produto {
    width: 58px; height: 58px; border-radius: 12px;
    background: #EEF1FB; display: flex; align-items: center;
    justify-content: center; font-size: 24px; flex-shrink: 0;
  }
  .produto .info { flex: 1; min-width: 0; }
  .produto .nome { font-weight: 600; font-size: 15px; margin-bottom: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .produto .cat {
    display: inline-block; font-size: 10px; font-weight: 700;
    padding: 2px 8px; border-radius: 6px; margin-bottom: 6px;
  }
  .cat.BW { background: #FCE4EC; color: #E91E63; }
  .cat.HC { background: #E3F2FD; color: #2196F3; }
  .cat.NT { background: #FFF3E0; color: #FF9800; }
  .produto .dias { font-size: 12px; font-weight: 600; }
  .produto .dias.ok { color: var(--verde); }
  .produto .dias.alerta { color: var(--amarelo); }
  .produto .dias.vencido { color: var(--vermelho); }
  .produto .data { font-size: 11px; color: var(--cinza); margin-top: 2px; }
  .produto .del {
    position: absolute; top: 10px; right: 10px; background: #FFEBEE;
    border: none; color: var(--vermelho); width: 28px; height: 28px;
    border-radius: 8px; font-size: 16px; cursor: pointer;
  }

  .vazio {
    text-align: center; padding: 60px 20px; color: var(--cinza);
  }
  .vazio .emoji { font-size: 48px; margin-bottom: 12px; }

  /* ---------- BOTÃO FLUTUANTE ---------- */
  .fab {
    position: fixed; bottom: 90px; right: 20px; width: 60px; height: 60px;
    border-radius: 20px; border: none; background: linear-gradient(135deg, var(--azul), var(--azul-claro));
    color: white; font-size: 30px; cursor: pointer; box-shadow: 0 8px 20px rgba(31,54,199,.4);
    display: flex; align-items: center; justify-content: center; transition: .2s;
  }
  .fab:active { transform: scale(.9); }

  /* ---------- NAV INFERIOR ---------- */
  .nav {
    position: fixed; bottom: 0; left: 0; right: 0; background: var(--card);
    display: flex; padding: 10px 0 14px; box-shadow: 0 -4px 16px rgba(0,0,0,.05);
    z-index: 10;
  }
  .nav button {
    flex: 1; background: none; border: none; font-family: inherit;
    font-size: 11px; color: var(--cinza); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .nav button .icone { font-size: 20px; }
  .nav button.ativo { color: var(--azul); font-weight: 600; }

  /* ---------- MODAL ---------- */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(20,25,50,.5);
    display: none; align-items: flex-end; z-index: 100;
  }
  .modal-bg.aberto { display: flex; }
  .modal {
    background: var(--card); width: 100%; border-radius: 24px 24px 0 0;
    padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
    max-height: 90vh; overflow-y: auto;
    animation: slideUp .3s ease;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: none; } }
  .modal h3 { font-size: 19px; margin-bottom: 18px; display: flex; justify-content: space-between; align-items: center; }
  .modal .fechar { background: #F0F2FA; border: none; width: 32px; height: 32px; border-radius: 10px; font-size: 18px; cursor: pointer; }

  .grupo-cats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .cat-btn {
    padding: 12px 6px; border: 2px solid #E4E8F5; background: var(--card);
    border-radius: 12px; font-family: inherit; font-size: 12px; font-weight: 600;
    cursor: pointer; transition: .2s;
  }
  .cat-btn.sel { border-color: var(--azul); background: #EEF1FF; color: var(--azul); }

  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px);
    background: var(--verde); color: white; padding: 12px 20px; border-radius: 12px;
    font-size: 14px; font-weight: 600; z-index: 200; transition: .3s;
    box-shadow: 0 8px 20px rgba(67,160,71,.3);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- ========== TELA LOGIN ========== -->
<div id="telaLogin" class="tela ativa">
  <div class="login-wrap">
    <div class="logo">
      <div class="logo-circle">📦</div>
      <h1>UniValidade</h1>
      <p>Controle de validade dos produtos</p>
    </div>
    <div class="campo">
      <label>Nome do Promotor</label>
      <input id="inNome" placeholder="Ex: João Silva" autocomplete="name">
    </div>
    <div class="campo">
      <label>Loja</label>
      <input id="inLoja" placeholder="Ex: Supermercado Bom Preço">
    </div>
    <div class="campo">
      <label>Cidade</label>
      <input id="inCidade" placeholder="Ex: São Paulo">
    </div>
    <button class="btn" onclick="entrar()">Entrar no Sistema →</button>
  </div>
</div>

<!-- ========== TELA DASHBOARD ========== -->
<div id="telaDash" class="tela">
  <div class="header">
    <h2>Olá, <span id="saudNome">Promotor</span> 👋</h2>
    <p class="sub" id="saudLoja">—</p>
  </div>

  <div class="resumo">
    <div class="card-resumo bw">
      <div class="num" id="countBW">0</div>
      <div class="lbl">Beauty W.</div>
    </div>
    <div class="card-resumo hc">
      <div class="num" id="countHC">0</div>
      <div class="lbl">Home Care</div>
    </div>
    <div class="card-resumo nt">
      <div class="num" id="countNT">0</div>
      <div class="lbl">Nutrition</div>
    </div>
  </div>

  <div class="header" style="margin-bottom:12px">
    <h2 style="font-size:17px">Produtos cadastrados</h2>
  </div>
  <div id="listaProdutos"></div>
</div>

<!-- ========== BOTÃO FLUTUANTE ========== -->
<button class="fab" id="fab" onclick="abrirModal()" style="display:none">+</button>

<!-- ========== NAV INFERIOR ========== -->
<div class="nav" id="nav" style="display:none">
  <button class="ativo" onclick="irPara('dash', this)">
    <span class="icone">🏠</span> Início
  </button>
  <button onclick="sair()">
    <span class="icone">🚪</span> Sair
  </button>
</div>

<!-- ========== MODAL CADASTRO ========== -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3>Novo Produto <button class="fechar" onclick="fecharModal()">✕</button></h3>

    <div class="campo">
      <label>Nome do Produto</label>
      <input id="inProduto" placeholder="Ex: Maionese Hellmann's 500g">
    </div>

    <div class="campo">
      <label>Marca</label>
      <input id="inMarca" placeholder="Ex: Hellmann's">
    </div>

    <div class="campo">
      <label>Categoria</label>
      <div class="grupo-cats">
        <button type="button" class="cat-btn" data-cat="BW" onclick="selCat(this)">BW</button>
        <button type="button" class="cat-btn" data-cat="HC" onclick="selCat(this)">HC</button>
        <button type="button" class="cat-btn" data-cat="NT" onclick="selCat(this)">NT</button>
      </div>
    </div>

    <div class="campo">
      <label>Data de Validade</label>
      <input type="date" id="inValidade">
    </div>

    <button class="btn" onclick="salvarProduto()">💾 Salvar Produto</button>
  </div>
</div>

<div class="toast" id="toast">✓ Produto salvo!</div>

<script>
/* ============ ESTADO ============ */
let promotor = null;
let produtos = JSON.parse(localStorage.getItem('univalidade_produtos') || '[]');
let categoriaSelecionada = null;

/* ============ LOGIN ============ */
function entrar() {
  const nome = document.getElementById('inNome').value.trim();
  const loja = document.getElementById('inLoja').value.trim();
  const cidade = document.getElementById('inCidade').value.trim();

  if (!nome || !loja || !cidade) {
    mostrarToast('Preencha todos os campos', '#E53935');
    return;
  }

  promotor = { nome, loja, cidade };
  localStorage.setItem('univalidade_promotor', JSON.stringify(promotor));

  document.getElementById('saudNome').textContent = nome.split(' ')[0];
  document.getElementById('saudLoja').textContent = `${loja} • ${cidade}`;

  document.getElementById('telaLogin').classList.remove('ativa');
  document.getElementById('telaDash').classList.add('ativa');
  document.getElementById('fab').style.display = 'flex';
  document.getElementById('nav').style.display = 'flex';

  renderizar();
}

function sair() {
  localStorage.removeItem('univalidade_promotor');
  location.reload();
}

/* ============ MODAL ============ */
function abrirModal() {
  document.getElementById('modalBg').classList.add('aberto');
  document.getElementById('inProduto').value = '';
  document.getElementById('inMarca').value = '';
  document.getElementById('inValidade').value = '';
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('sel'));
  categoriaSelecionada = null;
}

function fecharModal() {
  document.getElementById('modalBg').classList.remove('aberto');
}

function selCat(btn) {
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('sel'));
  btn.classList.add('sel');
  categoriaSelecionada = btn.dataset.cat;
}

/* ============ SALVAR PRODUTO ============ */
function salvarProduto() {
  const nome = document.getElementById('inProduto').value.trim();
  const marca = document.getElementById('inMarca').value.trim();
  const validade = document.getElementById('inValidade').value;

  if (!nome || !validade || !categoriaSelecionada) {
    mostrarToast('Preencha nome, categoria e validade', '#E53935');
    return;
  }

  const novo = {
    id: Date.now(),
    nome, marca,
    categoria: categoriaSelecionada,
    validade,
    promotor: promotor.nome,
    loja: promotor.loja,
    cidade: promotor.cidade
  };

  produtos.push(novo);
  localStorage.setItem('univalidade_produtos', JSON.stringify(produtos));

  fecharModal();
  mostrarToast('✓ Produto cadastrado!');
  renderizar();
}

/* ============ CALCULAR DIAS ============ */
function diasRestantes(dataValidade) {
  const hoje = new Date();
  hoje.setHours(0,0,0,0);
  const alvo = new Date(dataValidade + 'T00:00:00');
  return Math.ceil((alvo - hoje) / (1000 * 60 * 60 * 24));
}

function classeDias(dias) {
  if (dias < 0) return 'vencido';
  if (dias <= 30) return 'alerta';
  return 'ok';
}

function textoDias(dias) {
  if (dias < 0) return `⚠️ Vencido há ${Math.abs(dias)} dia(s)`;
  if (dias === 0) return `⚠️ Vence hoje!`;
  if (dias === 1) return `Vence amanhã`;
  return `Faltam ${dias} dias`;
}

/* ============ RENDERIZAR ============ */
function renderizar() {
  const lista = document.getElementById('listaProdutos');
  const meus = produtos.filter(p => p.promotor === promotor.nome);

  // contadores
  document.getElementById('countBW').textContent = meus.filter(p => p.categoria === 'BW').length;
  document.getElementById('countHC').textContent = meus.filter(p => p.categoria === 'HC').length;
  document.getElementById('countNT').textContent = meus.filter(p => p.categoria === 'NT').length;

  if (meus.length === 0) {
    lista.innerHTML = `
      <div class="vazio">
        <div class="emoji">📦</div>
        <p>Nenhum produto cadastrado ainda.</p>
        <p style="font-size:13px;margin-top:6px">Toque no botão <b>+</b> para começar</p>
      </div>`;
    return;
  }

  // ordena por validade (mais próximo primeiro)
  meus.sort((a, b) => new Date(a.validade) - new Date(b.validade));

  lista.innerHTML = meus.map(p => {
    const dias = diasRestantes(p.validade);
    const cls = classeDias(dias);
    const dataFmt = new Date(p.validade + 'T00:00:00').toLocaleDateString('pt-BR');
    return `
      <div class="produto ${cls}">
        <div class="icone-produto">📦</div>
        <div class="info">
          <span class="cat ${p.categoria}">${p.categoria}</span>
          <div class="nome">${p.nome}</div>
          <div class="dias ${cls}">${textoDias(dias)}</div>
          <div class="data">Validade: ${dataFmt}</div>
        </div>
        <button class="del" onclick="excluir(${p.id})">✕</button>
      </div>`;
  }).join('');
}

function excluir(id) {
  if (!confirm('Excluir este produto?')) return;
  produtos = produtos.filter(p => p.id !== id);
  localStorage.setItem('univalidade_produtos', JSON.stringify(produtos));
  renderizar();
  mostrarToast('Produto removido');
}

/* ============ TOAST ============ */
function mostrarToast(msg, cor = '#43A047') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = cor;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

/* ============ AUTO LOGIN ============ */
window.onload = () => {
  const salvo = localStorage.getItem('univalidade_promotor');
  if (salvo) {
    promotor = JSON.parse(salvo);
    document.getElementById('inNome').value = promotor.nome;
    document.getElementById('inLoja').value = promotor.loja;
    document.getElementById('inCidade').value = promotor.cidade;
    entrar();
  }
};
</script>
</body>
</html>
